
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/loginCSS.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <title>Ingreso</title>
</head>
<body>
    <main>
        <figure class="contenedor-logos">
            <img src="../assets/img/logoITI.jpg" alt="logo iti">
            <img src="../assets/img/imagen_2026-05-28_201450907-removebg-preview.png" alt="Logo SGRSI">
            <figcaption>Sistema de Gestion de Recursos y Soporte Informatico</figcaption>
        </figure>

        <div id="mensajeError" class="mensajeError"></div>

        <section class="seccionLogin">
            <h2>Ingreso al sistema</h2>
            <form id="formularioLogin">
                <div class="cajaDatos">
                    <label for="cedula">Cedula:</label>
                    <input type="text" id="cedula" name="cedula" pattern="[0-9]{8}" maxlength="8" inputmode="numeric" required><br><br>
                </div>
                <div class="cajaDatos">
                    <label for="clave">Contraseña:</label>
                    <input type="password" id="clave" name="clave" required><br><br>
                </div>
                <input type="submit" value="Ingresar" class="botones">
            </form>
            <span>¿No tienes una cuenta? <a href="mailto:direccioniti.cetp@gmail.com">Solicitala aqui</a> a través del mail: direccioniti.cetp@gmail.com</span>
        </section>
    </main>

    <script src="../assets/js/login.js"></script>
</body>
</html>
