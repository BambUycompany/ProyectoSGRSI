
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listado de Registros - SGRSI</title>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body data-roles-permitidos="soporte">

    <header class="barraNav">
        <nav>
            <button class="btnMenu" id="btnMenu" type="button">
                <i class="bi bi-list"></i>
            </button>

            <button class="btnCerrarMenu" id="btnCerrarMenu" type="button">
                <i class="bi bi-list"></i>
            </button>

            <h1>
                <a href="./soporte.html" id="enlaceInicio">
                    <img
                        src="../assets/img/imagen_2026-05-28_201450907-removebg-preview.png"
                        alt="Logo"
                        class="logo"
                    >
                    S.G.R.S.I
                </a>
            </h1>

            <ul class="listaNavegacion">
                <li data-roles="administrador solicitante soporte">
                    <a href="./registro_planilla.html" class="botones">
                        Registro Sala
                    </a>
                </li>

                <li data-roles="soporte">
                    <a href="./listado_registros.html" class="botones">
                        Listado Registro
                    </a>
                </li>

                <li data-roles="soporte">
                    <a href="./listado_tickets.html" class="botones">
                        Listado Tickets
                    </a>
                </li>

                <li data-roles="soporte solicitante">
                    <a href="./listado_prestamo.html" class="botones">
                        Listado Préstamos
                    </a>
                </li>

                <li class="menuUsuario">
                    <button
                        type="button"
                        id="btnIconoUsuario"
                        class="botones"
                    >
                        <i class="bi bi-person-fill"></i>
                    </button>

                    <ul class="opcionesUsuario" id="opcionesUsuario">
                        <li id="itemCambiarRol" style="display: none;">
                            <button type="button" id="btnCambiarRol">
                                Cambiar de rol
                            </button>
                        </li>

                        <li>
                            <button type="button" id="btnCerrarSesion">
                                Cerrar sesión
                            </button>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="seccionListadoRegistros">

            <h2>Listado de Registros de Sala</h2>

            <div
                id="mensajeRegistros"
                class="mensajeRegistros"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <div class="filtrarFecha">
                <label for="filtroPeriodo">
                    Filtrar por período:
                </label>

                <select id="filtroPeriodo">
                    <option value="todo">Todos los registros</option>
                    <option value="dia">Hoy</option>
                    <option value="semana">Esta semana</option>
                    <option value="mes">Este mes</option>
                </select>
            </div>

            <p id="mensajeSinRegistros" hidden>
                No se encontraron registros para el período seleccionado.
            </p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Aula</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Solicitante</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="cuerpoTablaRegistros"></tbody>
            </table>

        </section>
    </main>

    <script src="../assets/js/verificarSesion.js"></script>
    <script src="../assets/js/barraNavegacion.js"></script>
    <script src="../assets/js/listado_registro.js"></script>

</body>
</html>
