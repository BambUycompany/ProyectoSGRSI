    <main> 
        <section class="seccionPrestamos">
            <h2>Gestion de Prestamos</h2>
            <form action="index.html" method="post">
                <label for="NombreAlumno">Nombre del Alumno:</label>
                <input type="text" id="NombreAlumno" name="NombreAlumno" required><br><br>

                <label for="Clase">Clase:</label>
                <input type="text" id="Clase" name="Clase" required><br><br>

                <label for="Email">Email:</label>
                <input type="email" id="Email" name="Email" required><br><br>

                <label for="Cedula">Cédula:</label>
                <input type="text" id="Cedula" name="Cedula" required><br><br>

                <label for="Telefono">Teléfono:</label>
                <input type="text" id="Telefono" name="Telefono" required><br><br>

                <input type="submit" class="botones" value="Solicitar">
            </form>
        </section>
    </main>
