<!DOCTYPE html>
<html lang="en,es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/loginCSS.css">
    <link rel="stylesheet" href="../css/global.css">
    <title>Ingreso</title>
</head>
<body>
    <main>
        <section class="seccionLogin">
            <h2>Ingreso al sistema</h2>
            <form action="index.html" method="get">
               
                <div class="cajaDatos">
                    <label for="cedula">Cedula:</label>
                    <input type="text" id="cedula" name="cedula" required><br><br>
                </div>
                <div class="cajaDatos">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required><br><br>
                </div>
                <section class="selectRol">
                    <span><b>por cuestiones practicas, solo por estas revisiones se debe seleccionar un rol para visualizar sus diferentes permisos</b></span><br>
                
                    <label for="rol">Rol:</label>
                    <select id="rol" name="rol" required>
                        <option value="">Selecciona un rol</option>
                        <option value="solicitante">Solicitante</option>
                        <option value="administrador">Administrador</option>
                        <option value="soporte">Soporte técnico</option>
                    </select><br><br>
                </section>
                <input type="submit" value="Ingresar" class="botones">
            </form>
            <span class="spanLogin">¿No tienes una cuenta? <a href="mailto:direccioniti.cetp">Solicitala aqui </a> atraves del mail: direccioniti.cetp@gmail.com</span>
        </section>
        
    </main>
</body>
</html>
