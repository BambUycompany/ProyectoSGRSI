</head>

                <i class="bi bi-list"></i>
            </button>

            <h1>
                <a href="./login.html" id="enlaceInicio">
                    <img
                        src="../assets/img/imagen_2026-05-28_201450907-removebg-preview.png"
                        alt="Logo"
                        class="logo">
                    S.G.R.S.I
                </a>
            </h1>

            <ul class="listaNavegacion">

                <li data-roles="administrador solicitante soporte">
                    <a href="./registro_planilla.html"
                       class="botones">Registro Sala</a>
                </li>

                <li data-roles="administrador">
                    <a href="./registro_empleados.html"
                       class="botones">Empleados</a>
                </li>

                <li data-roles="administrador soporte">
                    <a href="./gestor_recursos.html"
                       class="botones">Gestor de Recursos</a>
                </li>

                <li data-roles="soporte">
                    <a href="./listado_registros.html"
                       class="botones">Listado Registro</a>
                </li>

                <li data-roles="soporte">
                    <a href="./listado_tickets.html"
                       class="botones">Tickets</a>
                </li>

                <li data-roles="administrador soporte">
                    <a href="./metricas.html"
                       class="botones">Métricas</a>
                </li>

                <li data-roles="solicitante">
                    <a href="./solicitar_prestamos.html"
                       class="botones">Solicitar Préstamo</a>
                </li>

                <li data-roles="solicitante">
                    <a href="./listado_prestamo.html"
                       class="botones">Mis Préstamos</a>
                </li>

                <li class="menuUsuario">
                    <button
                        type="button"
                        id="btnIconoUsuario"
                        class="botones">
                        <i class="bi bi-person-fill"></i>
                    </button>

                    <ul class="opcionesUsuario" id="opcionesUsuario">
                        <li>
                            <button type="button"
                                    id="btnCambiarRol">
                                Cambiar de rol
                            </button>
                        </li>

                        <li>
                            <button type="button"

                                Cerrar sesión
                            </button>

                    </ul>

            </ul>
        </nav>
    </header>

    <main>
        <section class="seccionRegistroSala">

            <h2>Registro de uso de Sala Informática</h2>

            <section class="formSala">

                <form id="formularioRegistroPlanilla">

                    <label for="tipo">Tipo de sala:</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Seleccionar</option>
                        <option value="laboratorio">Laboratorio</option>
                        <option value="taller">Taller</option>
                    </select>

                    <label for="numero">Número:</label>
                    <select id="numero" name="numero" required>
                        <option value="">Seleccionar</option>
                    </select>

                    <label for="fecha">Fecha:</label>
                    <input type="date"
                           id="fecha"
                           name="fecha"
                           required>

                    <label for="horaEntrada">Hora Entrada:</label>
                    <input type="time"
                           id="horaEntrada"
                           name="horaEntrada"
                           required>

                    <label for="horaSalida">Hora Salida:</label>
                    <input type="time"
                           id="horaSalida"
                           name="horaSalida"
                           required>
                                        
                    <div id="camposDocente">

                    <label for="nombreSolicitante">Solicitante:</label>
                    <input type="text"
                           id="nombreSolicitante"
                           name="nombreSolicitante"
                           maxlength="150"
                           required>

                        <label for="Asignatura">Asignatura:</label>
                        <input type="text"
                               id="Asignatura"
                               name="Asignatura"
                               maxlength="100">

                        <label for="grupo">Grupo:</label>
                        <input type="text"
                               id="grupo"
                               name="grupo"
                               maxlength="50">

                        <label for="turno">Turno:</label>
                        <select id="turno" name="turno">
                            <option value="">Seleccionar</option>
                            <option value="mañana">Mañana</option>
                            <option value="tarde">Tarde</option>
                            <option value="noche">Noche</option>
                        </select>
                    </div>

                    <input type="submit"
                           value="Registrar"
                           class="btnRegistrar">

                </form>
            </section>

            <div id="resumenTickets"></div>

            <button
                type="button"
                class="btnOperacion"
                id="btnCrearTicket">
                Reportar falla técnica
            </button>

        </section>
    </main>

    <section class="creacionTicket" id="creacionTicket">

        <button type="button"
                class="btnCerrarModal"
                id="btnCerrarModalTicket">
            x
        </button>

        <h2>Creación de ticket</h2>

        <label for="numeroPc">Número de PC:</label>
        <input type="text"
               id="numeroPc"
               pattern="PC-[0-9]{2,}"
               maxlength="20"
               placeholder="Ej: PC-01"
               required>

        <label for="fallo">Tipo de falla:</label>
        <select id="fallo" required>
            <option value="">Seleccionar</option>
            <option value="falta_mouse">Falta mouse</option>
            <option value="mouse_no_funciona">Mouse no funciona</option>
            <option value="falta_teclado">Falta teclado</option>
            <option value="teclado_no_funciona">Teclado no funciona</option>
            <option value="no_prende">No prende</option>
            <option value="sin_almacenamiento">Sin almacenamiento</option>
            <option value="bajo_rendimiento">Bajo rendimiento</option>
            <option value="otro">Otro</option>
        </select>

        <label for="descripcion">Descripción de la falla:</label>
        <textarea id="descripcion"
                  rows="4"
                  cols="50"
                  required></textarea>

        <button type="button"
                id="btnAgregarTicketALaLista">
            Agregar a la lista
        </button>

    </section>

    <script src="../assets/js/verificarSesion.js"></script>
    <script src="../assets/js/barraNavegacion.js"></script>
    <script src="../assets/js/registro_planilla.js"></script>
    <script src="../assets/js/actualizar_numero.js"></script>
    <script src="../assets/js/planilla.js"></script>
    <script src="../../public/assets/js/barraNavegacion.js"></script>

</body>
</html>
