                    >
                    S.G.R.S.I
                </a>
            </h1>

            <ul class="listaNavegacion">
                <li data-roles="administrador solicitante soporte">
                    <a href="./registro_planilla.html" class="botones">
                        Registro Sala
                    </a>
                </li>

                <li data-roles="administrador">
                    <a href="./registro_empleados.html" class="botones">

                <li data-roles="administrador">
                    <a href="./gestor_recursos.html" class="botones">

                <li data-roles="soporte">
                    <a href="./listado_registros.html" class="botones">
                        Listado Registro
                    </a>
                </li>

                <li data-roles="soporte">
                    <a href="./listado_tickets.html" class="botones">
                        Listado Tickets
                    </a>
                </li>

                <li data-roles="administrador">
                    <a href="./metricas.html" class="botones">
                        Métricas
                    </a>
                </li>

                <li data-roles="solicitante">
                    <a href="./solicitar_prestamos.html" class="botones">
                        Solicitar Préstamo
                    </a>
                </li>

                <li data-roles="solicitante soporte">
                    <a href="./listado_prestamo.html" class="botones">
                        Listado Préstamos
                    </a>
                </li>

                <li class="menuUsuario">
                    <button
                        type="button"
                        id="btnIconoUsuario"
                        class="botones"
                    >
                        <i class="bi bi-person-fill"></i>
                    </button>

                    <ul class="opcionesUsuario" id="opcionesUsuario">
                        <li id="itemCambiarRol" style="display: none;">
                            <button type="button" id="btnCambiarRol">
                                Cambiar de rol
                            </button>
                        </li>

                        <li>
                            <button type="button" id="btnCerrarSesion">
                                Cerrar sesión
                            </button>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="seccionTablaEmpleados">

            <div class="cabeceraTabla">
                <h2>Gestionar empleados</h2>

                <button
                    type="button"
                    class="btnOperacion"
                    id="btnAgregarEmpleado"
                >
                    Agregar empleado
                </button>
            </div>

            <div
                id="mensajeEmpleados"
                class="mensajeEmpleados"
                role="status"
                aria-live="polite"
                hidden
            ></div>

            <p id="mensajeSinEmpleados" hidden>
                No hay empleados registrados.
            </p>

            <table>
                <thead>
                    <tr>
                        <th>Cédula</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Roles</th>
                        <th>Estado</th>
                        <th id="colOperacionesAcciones">Acciones</th>
                    </tr>
                </thead>

                <tbody id="cuerpoTablaEmpleados"></tbody>
            </table>
        </section>

        <dialog class="dialogAgregarEmpleado">

            <button
                type="button"
                class="btnCerrarModal"
                id="btnCerrarAgregarEmpleado"
            >
                x
            </button>

            <h2 id="tituloDialogEmpleado">Agregar empleado</h2>

            <form id="formAgregarEmpleado">

                <label for="nombre">Nombre:</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                    maxlength="50"
                    required
                >

                <label for="apellido">Apellido:</label>
                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                    maxlength="50"
                    required
                >

                <label for="cedula">Cédula:</label>
                <input
                    type="text"
                    id="cedula"
                    name="cedula"
                    pattern="[0-9]{8}"
                    maxlength="8"
                    inputmode="numeric"
                    required
                >

                <label for="claveHash">Contraseña:</label>
                <input
                    type="password"
                    id="claveHash"
                    name="clave"
                    minlength="8"
                    maxlength="100"
                    required
                >

                <label for="confirmarClave">
                    Confirmar contraseña:
                </label>
                <input
                    type="password"
                    id="confirmarClave"
                    name="confirmarClave"
                    minlength="8"
                    maxlength="100"
                    required
                >

                <label>Roles:</label>

                <div class="grupoRoles">
                    <label>
                        <input
                            type="checkbox"
                            name="roles"
                            value="administrador"
                        >
                        Administrador
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="roles"
                            value="solicitante"
                        >
                        Solicitante
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="roles"
                            value="soporte"
                        >
                        Soporte técnico
                    </label>
                </div>

                <button type="submit" id="btnGuardarEmpleado">
                    Agregar
                </button>
            </form>
        </dialog>
    </main>

    <script src="../assets/js/verificarSesion.js"></script>
    <script src="../assets/js/barraNavegacion.js"></script>
    <script src="../assets/js/registro_empleados.js"></script>

</body>
</html>
